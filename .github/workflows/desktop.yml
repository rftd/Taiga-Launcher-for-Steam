name: Desktop Windows and Linux
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: resources/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/app/package-lock.json
      - run: npm ci
      - run: node ../../tools/ci-run.mjs test
        timeout-minutes: 5
      - run: node ../../tools/ci-run.mjs appimage
        if: runner.os == 'Linux'
      - run: node ../../tools/ci-run.mjs windows
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Taiga-Launcher-${{ runner.os }}
          path: |
            dist/appimage/*.AppImage
            dist/appimage/*.AppImage.sha256
            dist/Taiga Launcher-win32-x64/
            dist/ci-logs/
          if-no-files-found: error
